[project]
name = "pecco-derecho"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raul Abanto", email = "raul0207abanto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain-community>=0.4.2",
    "openai>=3.27.0",
    "pydantic-settings>=2.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
pecco-derecho = "pecco_derecho:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "uvicorn[standard]>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra"
