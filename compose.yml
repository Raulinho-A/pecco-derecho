services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-pecco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pecco}
      POSTGRES_DB: ${DB_NAME:-pecco}

    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-pecco} -d ${DB_NAME:-pecco}"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    volumes:
      - qdrant_data:/qdrant/storage


  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pecco}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pecco}

    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s


  api:
    build:
      context: .
      target: dev

    restart: unless-stopped

    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672

    ports:
      - "${API_HOST_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      qdrant:
        condition: service_started

    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true

        - action: rebuild
          path: pyproject.toml

        - action: rebuild
          path: uv.lock


  pgadmin:
    image: dpage/pgadmin4
    profiles:
      - debug

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pecco.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}

    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  pgadmin_data:
